name: Website Audit

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  audit:
    outputs:
      report_ready: ${{ steps.prepare_pages.outputs.report_ready }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      MAX_PAGES: ${{ vars.MAX_PAGES || '75' }}
      TARGETS_CSV: ${{ (github.event_name == 'pull_request') && 'test-data/audit-targets-pr.csv' || 'test-data/audit-targets.csv' }}
      AUDIT_WORKERS: '2'
      AUDIT_FAIL_ON_SEVERITY: ${{ vars.AUDIT_FAIL_ON_SEVERITY || 'Medium' }}
      GLOBAL_TIMEOUT_MS: ${{ vars.GLOBAL_TIMEOUT_MS || '10800000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Run website audit
        id: audit_run
        continue-on-error: true
        run: npm run audit

      - name: Prepare GitHub Pages dashboard
        id: prepare_pages
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && steps.audit_run.outcome != 'skipped' && hashFiles('reports/website-audit-report.html') != '' }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/reports _site/screenshots

          cp reports/batch-summary.html reports/*-report.html reports/*.xls _site/reports/
          find reports -mindepth 2 -maxdepth 2 -type f \( -name '*.html' -o -name '*.xls' \) \
            ! -path 'reports/playwright-html/*' \
            ! -path 'reports/raw-results/*' \
            ! -path 'reports/allure-results/*' \
            -exec cp --parents {} _site/ \;
          cp -a screenshots/. _site/screenshots/

          test -s _site/reports/website-audit-report.html
          echo "report_ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Pages artifact
        if: ${{ steps.prepare_pages.outputs.report_ready == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Add audit summary
        if: always()
        env:
          PAGES_REPORT_READY: ${{ steps.prepare_pages.outputs.report_ready }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const reportPath = 'reports/website-audit-report.json';
          let summary = '## Website audit\n\n';

          if (!fs.existsSync(reportPath)) {
            summary += 'The custom report was not generated. Check the earlier workflow steps for the failure.\n';
          } else {
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const counts = report.summary || {};
            summary += `- Targets: ${counts.targets ?? 0}\n`;
            summary += `- Pages crawled: ${counts.pagesCrawled ?? 0}\n`;
            summary += `- Total findings: ${counts.totalIssues ?? 0}\n`;
            summary += `- Critical / High / Medium / Low: ${counts.criticalIssues ?? 0} / ${counts.highIssues ?? 0} / ${counts.mediumIssues ?? 0} / ${counts.lowIssues ?? 0}\n`;
            summary += '\nDownload the `website-audit-reports` artifact below for the custom HTML reports and evidence.\n';
            if (['workflow_dispatch', 'schedule'].includes(process.env.GITHUB_EVENT_NAME)) {
              summary += process.env.PAGES_REPORT_READY === 'true'
                ? 'The latest published dashboard link is in the **Publish audit dashboard** job summary.\n'
                : 'The dashboard was not prepared for publishing; check the audit output and report-generation steps.\n';
            }
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE

      - name: Upload custom audit reports and evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-audit-reports
          retention-days: 14
          if-no-files-found: warn
          path: |
            reports/website-audit-report.html
            reports/website-audit-report.json
            reports/website-audit-report.xls
            reports/batch-summary.html
            reports/*-report.html
            reports/*/
            reports/history
            reports/raw-results
            screenshots
            traces
            logs

      - name: Preserve audit failure status
        if: ${{ always() && steps.audit_run.outcome == 'failure' }}
        run: |
          echo "The website audit failed. Review the audit summary and generated reports."
          exit 1

  publish:
    name: Publish audit dashboard
    needs: audit
    if: ${{ always() && !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && needs.audit.outputs.report_ready == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add dashboard link to job summary
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pageUrl = process.env.PAGE_URL;
          let summary = '## Website audit dashboard\n\n';

          if (pageUrl) {
            const reportUrl = `${pageUrl.replace(/\/+$/, '')}/reports/website-audit-report.html`;
            summary += `**Latest report:** [Open the interactive audit dashboard](${reportUrl})\n\n`;
            summary += 'This link points to the latest deployment; a later manual or nightly run replaces it.\n';
          } else {
            summary += 'The report was generated, but the Pages deployment did not return a URL. Check the deployment step logs and repository Pages settings.\n';
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE
